name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Create release pull request or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite Plus
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build package
        run: vp run build

      - name: Check formatting, lint, and types
        run: vp check

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          version-script: vp run version-packages
          publish-script: vp exec changeset publish
          commit-message: "release: update package version"
          pr-title: "release: update package version"
          create-github-releases: true
