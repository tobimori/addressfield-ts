name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Check and pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite Plus
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build package
        run: vp run build

      - name: Check formatting, lint, and types
        run: vp check

      - name: Pack npm archive
        run: vp pm pack --pack-destination .cache/package

      - name: Upload npm archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .cache/package/*.tgz
          if-no-files-found: error
